<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>YMK Edit Carousel</title>
<style>
:root { padding: 0 !important; }
img, video { max-width: none !important; max-height: none !important; }

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
*::before, *::after { box-sizing:border-box; }

html, body { width:100%; height:100%; background:#000; overflow:hidden; touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }

:root {
  --bg: #fff;
  --text-main: #333;
  --safe-top: 44px;
  --safe-bot: 0px;
}

.device-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#000; }
.phone-frame {
  position:relative; width:320px; height:693px; background:var(--bg);
  border-radius:44px; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 0 0 1px rgba(255,255,255,.13), 0 0 0 8px #161616, 0 0 0 9px rgba(255,255,255,.07), 0 40px 80px rgba(0,0,0,.9);
}
@media (max-width:480px) {
  html, body { background:var(--bg); height:100lvh; }
  .device-wrap { display:block; min-height:0; height:100lvh; background:var(--bg); }
  .phone-frame {
    width:320px !important;
    height:calc(100lvh / var(--mob-scale, 1)) !important;
    border-radius:0 !important; box-shadow:none !important; transform-origin:top left;
  }
}

.scroll-area { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; position:relative; }
.scroll-area::-webkit-scrollbar { display:none; }
.blk { display:block; width:320px; }

/* full-bleed top: desktop = Figma status bar over the banner; phone = banner top only, under the real status bar */
.top-strip { height:var(--safe-top); background:url(media/top_desktop.png) center bottom / 100% 100% no-repeat; }
@media (max-width:480px) { .top-strip { background-image:url(media/top_phone.png); } }

/* Main Action Bar — Figma 5273:364930 */
.action-bar { position:relative; width:320px; height:62px; }
.rot-mask { position:absolute; left:68px; top:13px; width:80px; height:21px; background:var(--bg); }
.rot {                                   /* text node 5273:364934 at (71.5, 15.5) in the bar */
  position:absolute; left:3.5px; top:2.5px; width:72px; height:16px; overflow:hidden;
}
.rot-track { will-change:transform; }
.rot-item {
  display:block; height:16px; line-height:16px; white-space:nowrap;
  font-family:"SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-weight:500; font-size:13.5px; color:var(--text-main);
}

.bottom-nav { position:absolute; left:0; bottom:var(--safe-bot); width:320px; height:130px; z-index:10; pointer-events:none; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
</style>

</head>
<body>
<div class="device-wrap">
  <div class="phone-frame" id="frame">
    <div class="scroll-area" id="scroll-area">
      <div class="top-strip"></div>
      <img class="blk" src="media/hero.png" width="320" height="196" alt="YouCam Makeup — Perfect Your Smile">
      <div class="action-bar">
        <img class="blk" src="media/action_bar.png" width="320" height="62" alt="">
        <div class="rot-mask">
          <div class="rot" role="text" aria-label="Photo Edit">
            <div class="rot-track" id="rot-track">
              <span class="rot-item">Photo Edit</span>
              <span class="rot-item">Video Edit</span>
              <span class="rot-item" aria-hidden="true">Photo Edit</span>
            </div>
          </div>
        </div>
      </div>
      <img class="blk" src="media/tiles.png" width="320" height="218" alt="Feature tiles">
      <img class="blk" src="media/content.png" width="320" height="173" alt="Hair Magic">
    </div>
    <img class="bottom-nav" src="media/bottom_nav.png" width="320" height="130" alt="">
  </div>
</div>
<script>
/* Photo Edit ⇄ Video Edit — vertical carousel: hold 3s, slide up 300ms, loop */
(function () {
  var HOLD = 3000, STEP = 16, track = document.getElementById('rot-track');
  var rot = track.parentNode, labels = ['Photo Edit', 'Video Edit'], i = 0;
  function set(idx, animate) {
    track.style.transition = animate ? 'transform 300ms cubic-bezier(.4,0,.2,1)' : 'none';
    track.style.transform = 'translateY(' + (-STEP * idx) + 'px)';
  }
  function next() { i += 1; set(i, true); }
  track.addEventListener('transitionend', function () {
    if (i >= labels.length) { i = 0; set(0, false); void track.offsetHeight; }
    rot.setAttribute('aria-label', labels[i]);
    setTimeout(next, HOLD);
  });
  set(0, false);
  setTimeout(next, HOLD);
})();

(function () {
  var MOBILE_MAX = 480, DESIGN_W = 320, root = document.documentElement;
  var BOTTOM_BAR_INCLUDES_HOME_INDICATOR = true;
  var FRAME_HEIGHT = 'lvh';
  var AUTO_RULE = { webview: 'env', safari: 'env' /* no Safari data yet — unverified */, other: 'env' };
  var NOTCH_HEIGHTS = [812, 896], NOTCH_FALLBACK = 44;

  function readInset(side) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;top:0;width:0;visibility:hidden;padding-top:env(safe-area-inset-' + side + ', 0px)';
    document.body.appendChild(d);
    var v = parseFloat(getComputedStyle(d).paddingTop) || 0;
    d.remove(); return v;
  }

  function apply() {
    var frame = document.getElementById('frame');
    if (window.innerWidth > MOBILE_MAX) {
      frame.style.transform = ''; frame.style.removeProperty('height');
      root.style.removeProperty('--mob-scale'); root.style.removeProperty('--safe-top'); root.style.removeProperty('--safe-bot');
      return;
    }
    var insetTop = readInset('top'), insetBot = readInset('bottom'), scale = window.innerWidth / DESIGN_W;
    var ua = navigator.userAgent, ios = /iP(hone|ad)/.test(ua);
    var standalone = navigator.standalone === true || (matchMedia && matchMedia('(display-mode: standalone)').matches);
    var envType = ios ? (standalone ? 'standalone' : (/Safari\//.test(ua) ? 'safari' : 'webview')) : 'other';
    var inj = (window.__insets && typeof window.__insets.top === 'number') ? window.__insets : null;

    var q = (location.search.match(/[?&]top=([^&]*)/) || [])[1] || 'auto';
    var mode = q === 'auto' ? (AUTO_RULE[envType] || 'env') : q;
    var topPad = mode === 'env' ? insetTop : (isFinite(parseFloat(mode)) ? parseFloat(mode) : insetTop);
    var fb = !inj && q === 'auto' && envType === 'webview' && insetTop === 0 && NOTCH_HEIGHTS.indexOf(screen.height) >= 0;
    if (fb) topPad = NOTCH_FALLBACK;
    if (inj && q === 'auto') { topPad = inj.top; if (typeof inj.bottom === 'number') insetBot = inj.bottom; }

    frame.style.transform = 'scale(' + scale + ')';
    root.style.setProperty('--mob-scale', scale);
    root.style.setProperty('--safe-top', (topPad / scale) + 'px');
    root.style.setProperty('--safe-bot', (BOTTOM_BAR_INCLUDES_HOME_INDICATOR ? 0 : insetBot / scale) + 'px');
    if (FRAME_HEIGHT === 'inner') frame.style.setProperty('height', (window.innerHeight / scale) + 'px', 'important');
    else frame.style.removeProperty('height');

    if (/[?&]safe(&|=|$)/.test(location.search)) {
      var b = document.getElementById('safe-dbg') ||
              document.body.appendChild(Object.assign(document.createElement('div'), { id: 'safe-dbg' }));
      b.style.cssText = 'position:fixed;left:4px;bottom:4px;z-index:99999;font:11px/1.3 monospace;background:rgba(0,0,0,.8);color:#fff;padding:3px 6px;border-radius:4px;pointer-events:none;white-space:pre';
      b.textContent = 'inset ' + insetTop + '/' + insetBot + ' · screen ' + screen.width + 'x' + screen.height +
                      ' · inner ' + window.innerWidth + 'x' + window.innerHeight + ' · ' + envType +
                      ' · injected=' + (inj ? (inj.top + (inj.build ? ' b' + inj.build : '')) : 'no') +
                      ' · top=' + q + (fb ? '(fallback)' : '') + '→' + topPad + '\n' + ua;
    }
  }
  apply();
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);
})();
</script>

</body>
</html>
